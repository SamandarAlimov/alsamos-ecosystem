name: AlsamOS pre-alpha CI
on:
  push:
    paths:
      - 'os/AlsamOS/**'
      - '.github/workflows/alsamos-os.yml'
  pull_request:
    paths:
      - 'os/AlsamOS/**'
      - '.github/workflows/alsamos-os.yml'
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and verify kernel structural invariants
        working-directory: os/AlsamOS
        run: make test
      - name: QEMU kernel boot and serial console smoke
        working-directory: os/AlsamOS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86
          make test-emulator
      - name: Checkout Samhus experimental compiler
        uses: actions/checkout@v4
        with:
          repository: SamandarAlimov/samhus
          path: samhus-compiler
          persist-credentials: false
      - name: Samhus VM/native policy differential test
        working-directory: os/AlsamOS
        run: |
          python -m pip install -e ../../samhus-compiler
          python tools/test_samhus.py
